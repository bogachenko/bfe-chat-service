name: DP-M07 Independent QA
on:
  pull_request:
    paths:
      - 'internal/storage/**'
      - 'qa/**'
      - '.github/workflows/qa-dpm07.yml'
permissions:
  contents: read
jobs:
  integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false
      - name: Install pinned QA-only dependencies in ephemeral checkout
        run: |
          go get github.com/jackc/pgx/v5@v5.11.0 github.com/pressly/goose/v3@v3.28.0 github.com/testcontainers/testcontainers-go/modules/postgres@v0.44.0 pgregory.net/rapid@v1.2.0
          go mod tidy
          go list -m github.com/docker/docker github.com/testcontainers/testcontainers-go github.com/testcontainers/testcontainers-go/modules/postgres
      - name: PostgreSQL 18.6 integration and race
        run: |
          go test -tags=integration -count=1 -timeout=25m ./internal/storage/...
          go test -tags=integration -race -count=1 -timeout=25m ./internal/storage/...
      - name: Coverage
        run: |
          go test -tags=integration -covermode=atomic -coverprofile=coverage.out -timeout=25m ./internal/storage/...
          go tool cover -func=coverage.out | tee coverage.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dp-m07-qa-coverage
          path: |
            coverage.out
            coverage.txt
          if-no-files-found: ignore
  mutation:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false
      - name: Gremlins v0.6.0
        run: |
          go install github.com/go-gremlins/gremlins/cmd/gremlins@v0.6.0
          "$(go env GOPATH)/bin/gremlins" unleash --exclude-files '.*_test\\.go$' --exclude-files '.*\\.pb\\.go$'
