name: DP-M07 Independent QA
on:
  pull_request:
    paths:
      - 'internal/storage/**'
      - 'qa/**'
      - '.github/workflows/qa-dpm07.yml'
permissions:
  contents: read
jobs:
  integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false
      - name: Install pinned QA-only dependencies in ephemeral checkout
        run: |
          go get github.com/jackc/pgx/v5@v5.11.0 github.com/pressly/goose/v3@v3.28.0 github.com/testcontainers/testcontainers-go/modules/postgres@v0.44.0 pgregory.net/rapid@v1.2.0
          go mod tidy
          go list -m github.com/testcontainers/testcontainers-go github.com/testcontainers/testcontainers-go/modules/postgres
      - name: PostgreSQL 18.6 integration and race
        run: |
          go test -tags=integration -count=1 -timeout=25m ./internal/storage/...
          go test -tags=integration -race -count=1 -timeout=25m ./internal/storage/...
      - name: Module Coverage (80%, blocking)
        run: |
          go test -tags=integration -covermode=atomic -coverprofile=module-coverage.out -timeout=25m ./internal/storage/...
          go tool cover -func=module-coverage.out | tee module-coverage.txt
          go test -tags=integration -coverpkg=./cmd/...,./internal/... -covermode=atomic -coverprofile=project-coverage.out -timeout=25m ./...
          go tool cover -func=project-coverage.out | tee project-coverage.txt
          python3 qa/coverage_report.py --module-profile module-coverage.out --project-profile project-coverage.out --output coverage-report.md
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dp-m07-staged-coverage
          path: |
            module-coverage.out
            module-coverage.txt
            project-coverage.out
            project-coverage.txt
            coverage-report.md
          if-no-files-found: ignore
  mutation:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false
      - name: Install pinned integration dependencies for Gremlins
        run: |
          go get github.com/jackc/pgx/v5@v5.11.0 github.com/pressly/goose/v3@v3.28.0 github.com/testcontainers/testcontainers-go/modules/postgres@v0.44.0 pgregory.net/rapid@v1.2.0
          go mod tidy
      - name: Gremlins v0.6.0 — FC-11/FC-12 with real PostgreSQL
        run: |
          go install github.com/go-gremlins/gremlins/cmd/gremlins@v0.6.0
          "$(go env GOPATH)/bin/gremlins" unleash --tags integration --output mutation-storage.json --output-statuses lkct --exclude-files '.*_test\\.go --exclude-files '.*\\.pb\\.go --exclude-files '^internal/chat/' --exclude-files '^internal/documentcontext/' --exclude-files '^tools/' --exclude-files '^cmd/'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dp-m07-mutation
          path: mutation-storage.json
          if-no-files-found: error
