name: QR07 finish formatting
on:
  push:
    branches: [feat/issue-25-requirements-analysis]
permissions:
  contents: write
jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/issue-25-requirements-analysis
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Native gofmt on changed production files
        run: |
          gofmt -w internal/issue25/http.go internal/issue25/issue25.go internal/issue25/lifecycle.go internal/realtime/realtime.go
          git diff --check
          git add -- internal/issue25/http.go internal/issue25/issue25.go internal/issue25/lifecycle.go internal/realtime/realtime.go
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'style(qr07): gofmt completed production refactoring'
            git push origin HEAD:refs/heads/feat/issue-25-requirements-analysis
          fi
