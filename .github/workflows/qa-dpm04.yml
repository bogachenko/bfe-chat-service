name: DP-M04 Independent QA
on:
  pull_request:
    paths:
      - 'internal/authorization/**'
      - 'internal/storage/**'
      - '.github/workflows/qa-dpm04.yml'
permissions:
  contents: read
jobs:
  authorization:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false
      - name: Authorization unit and Race Detection
        run: go test -race -count=1 ./internal/authorization/...
      - name: Authorization coverage gate 90 percent
        run: |
          go test -coverprofile=authorization-coverage.out -count=1 ./internal/authorization/...
          go tool cover -func=authorization-coverage.out | tee authorization-coverage.txt
          awk '/^total:/ {gsub(/%/, "", $3); found=1; if ($3+0 < 90) exit 1} END {if (!found) exit 1}' authorization-coverage.txt
  ms-f02:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false
      - name: Install QA-only PostgreSQL dependencies
        run: |
          go get github.com/jackc/pgx/v5@v5.11.0 github.com/pressly/goose/v3@v3.28.0 github.com/testcontainers/testcontainers-go/modules/postgres@v0.44.0 pgregory.net/rapid@v1.2.0
          go mod tidy
      - name: PostgreSQL 18.6 MS-F02 and race
        run: |
          go test -tags=integration -count=1 -run '^TestDPM04' -timeout=25m ./internal/storage
          go test -tags=integration -race -count=1 -run '^TestDPM04' -timeout=25m ./internal/storage
