name: Quality Gates
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  go-quality:
    timeout-minutes: 30
    # Never execute pull_request head code on a personal self-hosted runner.
    # Only the protected main push path can use the local machine.
    runs-on: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && 'self-hosted' || 'ubuntu-24.04' }}
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_USER: bfe
          POSTGRES_PASSWORD: test_only_password
          POSTGRES_DB: bfe_chat
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -U bfe -d bfe_chat"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
    env:
      BFE_CHAT_TEST_DATABASE_URL: postgres://bfe:test_only_password@localhost:${{ job.services.postgres.ports[5432] }}/bfe_chat?sslmode=disable
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum
      - name: Restore pinned Go tools cache
        id: tools-cache
        uses: actions/cache@v4
        with:
          path: ~/go/bin
          key: go-tools-bin-only-go1.27.3-v5-lint2.14.0-gosec2.29.0-vuln1.9.0-dupl1.1.0-cyclop1.2.3-gremlins0.6.0-x-tools0.52.0
      - name: Install pinned tools
        if: steps.tools-cache.outputs.cache-hit != 'true'
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.14.0
          # Build gosec with Go 1.27-compatible x/tools instead of its older transitive version.
          tmp="$(mktemp -d)"
          (
            cd "$tmp"
            go mod init bfe-tools-gosec
            go get github.com/securego/gosec/v2@v2.29.0
            go get golang.org/x/tools@v0.52.0
            go build -mod=mod -o "$(go env GOPATH)/bin/gosec" github.com/securego/gosec/v2/cmd/gosec
          )
          rm -rf "$tmp"
          go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
          go install github.com/mibk/dupl@v1.1.0
          # Pin cyclop and override legacy x/tools for Go 1.27 export data.
          cyclop_tmp="$(mktemp -d)"
          (
            cd "$cyclop_tmp"
            go mod init bfe-tools-cyclop
            go get github.com/bkielbasa/cyclop@v1.2.3
            go get golang.org/x/tools@v0.52.0
            go build -mod=mod -o "$(go env GOPATH)/bin/cyclop" github.com/bkielbasa/cyclop/cmd/cyclop
          )
          rm -rf "$cyclop_tmp"
          go install github.com/go-gremlins/gremlins/cmd/gremlins@v0.6.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Add cached tools to PATH
        run: echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Prepare isolated Issue25 database
        run: go run github.com/pressly/goose/v3/cmd/goose@v3.28.0 -dir internal/storage/migrations postgres "$BFE_CHAT_TEST_DATABASE_URL" up
      - name: Blocking Go quality gates
        run: make quality
      - name: Changed-code mutation on PR
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: origin/${{ github.base_ref }}
        run: make mutation-pr
