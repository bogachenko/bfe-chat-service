name: Quality Gates
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  go-quality:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Install pinned tools
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.12.2
          go install github.com/securego/gosec/v2/cmd/gosec@v2.28.0
          go install golang.org/x/vuln/cmd/govulncheck@v1.1.2
          go install github.com/mibk/dupl@v1.1.0
          go install github.com/bkielbasa/cyclop/cmd/cyclop@v1.2.3
          go install github.com/go-gremlins/gremlins/cmd/gremlins@v0.6.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Blocking Go quality gates
        run: make quality
      - name: Changed-code mutation on PR
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: origin/${{ github.base_ref }}
        run: make mutation-pr
