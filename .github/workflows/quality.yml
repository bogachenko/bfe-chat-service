name: Quality Gates
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  go-quality:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false
      - name: Install pinned tools
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.14.0
          # Build gosec with Go 1.27-compatible x/tools instead of its older transitive version.
          tmp="$(mktemp -d)"
          (
            cd "$tmp"
            go mod init bfe-tools-gosec
            go get github.com/securego/gosec/v2@v2.29.0
            go get golang.org/x/tools@v0.52.0
            go mod tidy
            go build -o "$(go env GOPATH)/bin/gosec" github.com/securego/gosec/v2/cmd/gosec
          )
          rm -rf "$tmp"
          go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
          go install github.com/mibk/dupl@v1.1.0
          go install github.com/bkielbasa/cyclop/cmd/cyclop@v1.2.3
          go install github.com/go-gremlins/gremlins/cmd/gremlins@v0.6.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Blocking Go quality gates
        run: make quality
      - name: Changed-code mutation on PR
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: origin/${{ github.base_ref }}
        run: make mutation-pr
