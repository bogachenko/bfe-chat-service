name: C4 Structurizr parser validation (temporary)
on:
  push:
    branches: [docs/c4-chat-architecture]
jobs:
  structurizr-validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Parse and validate C4 workspace with Structurizr CLI
        run: docker run --rm -v "$PWD:/usr/local/structurizr" structurizr/cli validate -workspace docs/architecture/c4/workspace.dsl
