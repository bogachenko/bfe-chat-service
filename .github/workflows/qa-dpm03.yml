name: DP-M03 Independent QA
on:
  pull_request:
    paths:
      - 'internal/conversations/**'
      - 'internal/storage/**'
      - '.github/workflows/qa-dpm03.yml'
permissions:
  contents: read
jobs:
  conversation-unit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false
      - name: FC-05 and FC-06 unit and race
        run: go test -race -count=1 ./internal/conversations/...
      - name: Conversation coverage critical threshold 90 percent
        run: |
          go test -count=1 -coverprofile=conversation-coverage.out ./internal/conversations/...
          go tool cover -func=conversation-coverage.out | tee conversation-coverage.txt
          awk '/^total:/ {gsub(/%/, "", $3); found=1; if ($3+0 < 90) exit 1} END {if (!found) exit 1}' conversation-coverage.txt
  postgres-integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false
      - name: Install QA-only PostgreSQL integration dependencies
        run: |
          go get github.com/jackc/pgx/v5@v5.11.0 github.com/pressly/goose/v3@v3.28.0 github.com/testcontainers/testcontainers-go/modules/postgres@v0.44.0 pgregory.net/rapid@v1.2.0
          go mod tidy
      - name: PostgreSQL 18.6 FC-05 FC-06 integration
        run: go test -tags=integration -count=1 -run '^TestDPM03' -timeout=25m ./internal/storage
      - name: PostgreSQL 18.6 transaction concurrency race
        run: go test -tags=integration -race -count=1 -run '^TestDPM03' -timeout=25m ./internal/storage
      - name: Storage module coverage 80 percent
        run: |
          go test -tags=integration -coverprofile=dp-m03-storage-coverage.out -timeout=25m ./internal/storage
          go tool cover -func=dp-m03-storage-coverage.out | tee dp-m03-storage-coverage.txt
          awk '/^total:/ {gsub(/%/, "", $3); found=1; if ($3+0 < 80) exit 1} END {if (!found) exit 1}' dp-m03-storage-coverage.txt
