# Managed by bfe-chat-service deploy/scripts/update-test-nginx.sh.
# Dedicated Chat virtual host. Do not edit BFE Drive configuration.
server {
    listen 80;
    listen [::]:80;
    server_name __CHAT_HOST__;

    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }
    location / {
        return 308 https://__CHAT_HOST__$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name __CHAT_HOST__;

    ssl_certificate /etc/letsencrypt/live/__CHAT_HOST__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__CHAT_HOST__/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    location = /ws {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 3600s;
        proxy_buffering off;
    }

    location = /conversations {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
    }

    location ^~ /conversations/ {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
    }

    location / {
        return 404;
    }
}
